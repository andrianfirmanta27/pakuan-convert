<!DOCTYPE html>
<html><head><title>Pakuan Convert</title>
<style>body{font-family:sans-serif;max-width:600px;margin:50px auto;padding:20px}.box{border:2px dashed #2e5aa8;padding:30px;text-align:center;border-radius:15px}button{background:#2e5aa8;color:white;padding:12px 25px;border:none;border-radius:8px;cursor:pointer}h2{color:#2e5aa8}</style>
</head><body>
<h2>Pakuan Convert - PDF ke Word</h2>
<div class="box">
<form method="post" enctype="multipart/form-data">
<input type="file" name="file" accept=".pdf" required><br><br>
<button type="submit">Convert ke Word</button>
</form>
<p style="font-size:12px;margin-top:15px">File tidak akan bocor, langsung kehapus otomatis</p>
</div>
</body></html>
